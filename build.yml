name: Zbuduj moda

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: FerrekKordy-mod
          path: build/libs/*.jar
      - name: Release (link do pobrania)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: FerrekKordy (build ${{ github.run_number }})
          files: build/libs/*.jar
